services:
  - type: web
    name: ledger-api
    runtime: python
    repo: https://github.com/lagarcess/payment-ledger-service/
    branch: master
    rootDir: .
    region: virginia
    plan: free
    autoDeployTrigger: off
    buildCommand: pip install poetry && poetry install
    startCommand: poetry run python -m src.ledger && poetry run uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
