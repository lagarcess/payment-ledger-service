services:
  - type: web
    name: ledger-api
    runtime: python
    repo: https://github.com/lagarcess/payment-ledger-service
    branch: master
    rootDir: .
    region: virginia
    plan: free
    # GitHub Actions triggers Render only after CI passes. Keep Render's native
    # auto-deploy off to avoid deploying before tests finish.
    autoDeployTrigger: off
    buildCommand: pip install "poetry==2.4.1" && poetry install --only main --no-interaction
    startCommand: poetry run python -m src.ledger && poetry run uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
