name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  essentials:
    name: Essential checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Validate project metadata
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Lint
        run: poetry run ruff check .

      - name: Test
        run: poetry run pytest

  deploy-render:
    name: Deploy Render API
    runs-on: ubuntu-latest
    needs: essentials
    if: github.repository == 'lagarcess/payment-ledger-service' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 5

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d8il3du47okc739gbja0
        run: |
          test -n "$RENDER_API_KEY"
          curl --fail-with-body --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}'
